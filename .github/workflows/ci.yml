name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
          # qtbase alone is the default; SerialPort/SerialBus are add-ons.
          modules: 'qtserialport qtserialbus'

      # The `ci` preset injects the Qt prefix from QT_ROOT_DIR, which
      # install-qt-action exports (local presets hardcode E:/Qt/...).
      - name: Configure (ci preset)
        run: cmake --preset ci

      - name: Build Release
        run: cmake --build --preset ci

      - name: Unit tests (ctest)
        run: ctest --test-dir build_ci -C Release --output-on-failure

      # Headless end-to-end self-tests — each exits non-zero unless its real
      # assertions hold. None requires com0com: --selftest expects the serial
      # pump OFFLINE (no COM pair on the runner ⇒ still offline ⇒ PASS).
      - name: "Self-test: end-to-end acquisition + serial offline"
        run: ./build_ci/Release/DAC-SCADA.exe --selftest

      - name: "Self-test: auto-reconnect (stop/restart TCP 1503)"
        run: ./build_ci/Release/DAC-SCADA.exe --selftest-reconnect

      - name: "Self-test: history read-back"
        run: ./build_ci/Release/DAC-SCADA.exe --selftest-history

      - name: "Self-test: remote write"
        run: ./build_ci/Release/DAC-SCADA.exe --selftest-write

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dac-scada-diagnostics
          path: |
            build_ci/Release/*_result.txt
            build_ci/Release/data/app.log*
          if-no-files-found: ignore
          retention-days: 7
